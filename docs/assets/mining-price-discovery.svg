<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative VUX takeover price discovery</title>
  <desc id="desc">Fourteen illustrative takeover payments rise from 50 to 2225 WETH-equivalent and then decline gradually through 1800, 1400, 1000, 700, 450, and 250.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14161a}.bg{fill:#fbfbfc}.title{font-size:30px;font-weight:500}.subtitle{font-size:16px;fill:#4d5561}.axis{font-size:13px;fill:#4d5561}.value{font-size:13px;font-weight:500}.phase{font-size:12px;font-weight:500;letter-spacing:1.2px}.grid{stroke:#e8eaf0;stroke-width:1}.axis-line{stroke:#d9dde5;stroke-width:2}.path{fill:none;stroke:#2b5fd9;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.cool-path{fill:none;stroke:#147a43;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.point{fill:#fbfbfc;stroke:#2b5fd9;stroke-width:3}.cool-point{fill:#fbfbfc;stroke:#147a43;stroke-width:3}.peak-point{fill:#7157c8;stroke:#fbfbfc;stroke-width:3}.climb-band{fill:#eaf0ff}.peak-band{fill:#f0edff}.cool-band{fill:#e8f7ee}
  </style>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="title" x="50" y="55">Price discovery can climb fast and cool gradually</text>
  <text class="subtitle" x="50" y="83">Illustrative paid takeovers · WETH-equivalent teaching values · no runtime USD oracle</text>

  <rect class="climb-band" x="90" y="108" width="525" height="410" rx="14" opacity="0.58"/>
  <rect class="peak-band" x="615" y="108" width="65" height="410" opacity="0.68"/>
  <rect class="cool-band" x="680" y="108" width="455" height="410" rx="14" opacity="0.58"/>
  <text class="phase" x="112" y="135" fill="#2b5fd9">COMPETITIVE CLIMB</text>
  <text class="phase" x="620" y="135" fill="#7157c8">PEAK</text>
  <text class="phase" x="700" y="135" fill="#147a43">GRADUAL COOLDOWN</text>

  <line class="grid" x1="90" y1="480" x2="1135" y2="480"/><text class="axis" x="47" y="485">0</text>
  <line class="grid" x1="90" y1="408" x2="1135" y2="408"/><text class="axis" x="35" y="413">500</text>
  <line class="grid" x1="90" y1="336" x2="1135" y2="336"/><text class="axis" x="25" y="341">1,000</text>
  <line class="grid" x1="90" y1="264" x2="1135" y2="264"/><text class="axis" x="25" y="269">1,500</text>
  <line class="grid" x1="90" y1="192" x2="1135" y2="192"/><text class="axis" x="25" y="197">2,000</text>
  <line class="grid" x1="90" y1="120" x2="1135" y2="120"/><text class="axis" x="25" y="125">2,500</text>
  <line class="axis-line" x1="90" y1="120" x2="90" y2="480"/><line class="axis-line" x1="90" y1="480" x2="1135" y2="480"/>

  <polyline class="path" points="100,473 178,466 256,454 334,431 412,388 490,307 568,264 646,160"/>
  <polyline class="cool-path" points="646,160 724,221 802,278 880,336 958,379 1036,415 1114,444"/>

  <g><circle class="point" cx="100" cy="473" r="6"/><circle class="point" cx="178" cy="466" r="6"/><circle class="point" cx="256" cy="454" r="6"/><circle class="point" cx="334" cy="431" r="6"/><circle class="point" cx="412" cy="388" r="6"/><circle class="point" cx="490" cy="307" r="6"/><circle class="point" cx="568" cy="264" r="6"/><circle class="peak-point" cx="646" cy="160" r="9"/></g>
  <g><circle class="cool-point" cx="724" cy="221" r="6"/><circle class="cool-point" cx="802" cy="278" r="6"/><circle class="cool-point" cx="880" cy="336" r="6"/><circle class="cool-point" cx="958" cy="379" r="6"/><circle class="cool-point" cx="1036" cy="415" r="6"/><circle class="cool-point" cx="1114" cy="444" r="6"/></g>

  <text class="value" x="88" y="456">$50</text><text class="value" x="164" y="449">$95</text><text class="value" x="238" y="437">$180</text><text class="value" x="315" y="414">$340</text>
  <text class="value" x="393" y="371">$640</text><text class="value" x="464" y="290">$1,200</text><text class="value" x="541" y="247">$1,500</text><text class="value" x="586" y="183" fill="#7157c8">$2,225</text>
  <text class="value" x="697" y="204" fill="#147a43">$1,800</text><text class="value" x="775" y="261" fill="#147a43">$1,400</text><text class="value" x="853" y="319" fill="#147a43">$1,000</text><text class="value" x="941" y="362" fill="#147a43">$700</text><text class="value" x="1019" y="398" fill="#147a43">$450</text><text class="value" x="1097" y="427" fill="#147a43">$250</text>

  <text class="axis" x="88" y="507">1</text><text class="axis" x="166" y="507">2</text><text class="axis" x="244" y="507">3</text><text class="axis" x="322" y="507">4</text><text class="axis" x="400" y="507">5</text><text class="axis" x="478" y="507">6</text><text class="axis" x="556" y="507">7</text><text class="axis" x="634" y="507">8</text><text class="axis" x="712" y="507">9</text><text class="axis" x="786" y="507">10</text><text class="axis" x="864" y="507">11</text><text class="axis" x="942" y="507">12</text><text class="axis" x="1020" y="507">13</text><text class="axis" x="1098" y="507">14</text>
  <text class="axis" x="480" y="545">Paid takeover sequence</text>

  <rect x="90" y="570" width="1045" height="48" rx="12" fill="#ffffff" stroke="#d9dde5"/>
  <text class="axis" x="110" y="599">Peak reign: ~29m 47s → ~$1,440 WETH + ~7,146.1 Settled VUX</text>
  <text class="axis" x="685" y="599">Final shown settlement: ~$200 WETH + ~5,134.5 Settled VUX</text>
</svg>
