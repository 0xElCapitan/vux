name: provenance

# Fail-closed provenance enforcement (PROV-9). Every gate runs on every push and
# pull request; a violation fails the build rather than warning.
#
# No secrets are used or required — the accepted refreeze §"Security
# Considerations" for Sprint 1 states CI must not require secrets.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: true

env:
  # Accepted toolchain pin — Foundry v1.5.0 toolchain refreeze (2026-08-12),
  # which supersedes the v1.0.0 selection of provenance refreeze §6 and changes
  # nothing else. Exact release tag only: `stable`, `latest`, `nightly`, and
  # branch names are never authority.
  FOUNDRY_VERSION: v1.5.0
  FOUNDRY_COMMIT: 1c57854462289b2e71ee7654cd6666217ed86ffd
  # [profile.ci] differs from the default only in fuzz depth (>=10,000 runs,
  # sdd.md:L853). run-all.sh overrides it explicitly for the vendored =0.7.6
  # build, whose settings are frozen by the refreeze.
  FOUNDRY_PROFILE: ci

jobs:
  gates:
    name: provenance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Byte identity is the whole point; prove the checkout itself did not
      # translate line endings before any hash is computed.
      - name: Assert checkout preserved bytes
        run: git config core.autocrlf false && git diff --exit-code

      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The pin is only evidence if it is asserted, and the workflow input is not
      # the assertion — it is the request. What must be checked is what the
      # installed binary says it is. A version-string match alone would accept
      # any build calling itself 1.5.0, so the exact 40-character release commit
      # is required; the version string is checked too, so a commit that ever
      # shipped under a different tag cannot satisfy it either.
      - name: Assert the pinned Foundry toolchain
        run: |
          ver="$(forge --version)"
          echo "$ver"
          jq --version
          case "$ver" in
            *"$FOUNDRY_COMMIT"*) : ;;
            *) echo "::error::expected Foundry commit ${FOUNDRY_COMMIT}, got: $ver"; exit 1 ;;
          esac
          case "$ver" in
            *"${FOUNDRY_VERSION#v}"*) : ;;
            *) echo "::error::expected Foundry ${FOUNDRY_VERSION}, got: $ver"; exit 1 ;;
          esac
          echo "toolchain is exactly foundry ${FOUNDRY_VERSION} @ ${FOUNDRY_COMMIT} (2026-08-12 toolchain refreeze)"

      - name: Run all provenance gates and tests
        run: bash tools/provenance/run-all.sh

  drift-negative-demonstration:
    name: drift gate fails closed on a 1-byte mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Mutates one byte of a vendored file, asserts the drift gate fails,
      # restores the exact bytes, and asserts the gate is green again.
      - name: Prove the drift gate closes
        run: bash tools/provenance/demo-drift-negative.sh

      - name: Assert the working tree was restored exactly
        run: git diff --exit-code && git status --porcelain --untracked-files=no

  source-boundary-negative-demonstration:
    name: source boundary fails closed on out-of-root, mis-cased and non-Solidity-named source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The toolchain is a hard requirement for this job, not a convenience. The
      # source universe now includes what the compiler admitted — read from both
      # units' build artifacts, extension-independently (sprint-2 audit M-1) —
      # so the demonstration builds the repository at baseline and again around
      # probes 14-16, whose payloads (`.txt`, extensionless) enter the universe
      # only because solc compiled them. Probe 12 additionally builds a throwaway
      # project in a temp directory, never this checkout, so the restoration
      # assertion below is unaffected.
      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Probe 12's verdict is toolchain-dependent in the strongest sense: under
      # v1.0.0 the mixed-case extension is refused outright ("unexpected file
      # extension") and under v1.5.0 it compiles and executes. This job does not
      # run verify-pins.sh, so without this step the one probe whose meaning
      # depends on the toolchain would be the one probe running unasserted.
      - name: Assert the pinned Foundry toolchain
        run: |
          ver="$(forge --version)"
          echo "$ver"
          case "$ver" in
            *"$FOUNDRY_COMMIT"*) : ;;
            *) echo "::error::expected Foundry commit ${FOUNDRY_COMMIT}, got: $ver"; exit 1 ;;
          esac
          case "$ver" in
            *"${FOUNDRY_VERSION#v}"*) : ;;
            *) echo "::error::expected Foundry ${FOUNDRY_VERSION}, got: $ver"; exit 1 ;;
          esac

      # Plants unauthorized source outside the census AND outside the declared
      # VUX source roots — contracts/ (Hardhat convention) and lib/ (Foundry's
      # dependency directory) — plus mixed-case extensions at the repository
      # root, in docs/, and inside a pruned Loa zone, plus Solidity named `.txt`
      # and with no extension at all, imported from a declared VUX root; asserts
      # each gate fails for the boundary reason on a `^FAIL` line rather than by
      # accident, removes every probe, and asserts green again.
      - name: Prove the source boundary closes
        run: bash tools/provenance/demo-boundary-negative.sh

      - name: Assert the working tree was restored exactly
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # ---------------------------------------------------------------------------
  # Sprint-6 off-chain surface (audit M-3).
  #
  # Before this job, CI executed ZERO off-chain code: the accepted-pin gate
  # existed only as an npm script nobody ran, while the Sprint-6 success metric
  # requires "CI: lockfile-drift gate active". The dependency path guarded here
  # is the one that signs user transactions (viem/wagmi), so a drift that no
  # gate observes is the whole risk.
  #
  # No new action and no new dependency: Node comes from the runner image and
  # every command is one the repository already defines.
  # ---------------------------------------------------------------------------
  offchain:
    name: off-chain gates (indexer + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Assert checkout preserved bytes
        run: git config core.autocrlf false && git diff --exit-code

      # Asserted rather than assumed: a runner image rollback must not silently
      # change what these gates mean. No setup-node action is added for this.
      - name: Assert a usable Node
        run: |
          node --version
          npm --version
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 20 ]; then
            echo "::error::Node >= 20 required, got $(node --version)"; exit 1
          fi

      # `npm ci` installs EXACTLY the lockfile and fails closed on any
      # manifest/lockfile disagreement. `--ignore-scripts` restates the accepted
      # posture from .npmrc (audit M-5) so CI can never be softer than a
      # developer machine, even if the file is edited.
      - name: Install indexer — exact, no lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: indexer

      - name: Install web — exact, no lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: web

      # The drift assertion proper: installing must not have rewritten a
      # manifest or a lockfile. `npm ci` refuses to update them, so any diff here
      # means the committed pair disagreed with what was resolved.
      - name: Assert no manifest or lockfile drift
        run: |
          git diff --exit-code -- \
            indexer/package.json indexer/package-lock.json \
            web/package.json web/package-lock.json

      - name: Accepted-pin gate
        run: node tools/offchain/verify-accepted-pins.mjs

      - name: Indexer unit suite
        run: npm test
        working-directory: indexer

      - name: Ponder codegen gate
        run: npm run verify:codegen
        working-directory: indexer

      - name: Web unit suite
        run: npm run test:units
        working-directory: web

      # A PRODUCTION build, never the test-env build. The two gates below read
      # `out/`, so this also guarantees CI never inspects a leftover artifact.
      - name: Production static export
        run: npm run build
        working-directory: web

      - name: Static-export / no-server gate
        run: npm run verify:static
        working-directory: web

      - name: Bundled-RSC gate
        run: npm run verify:rsc
        working-directory: web

      - name: Assert the gates left the tree unchanged
        run: git diff --exit-code

  # The pin gate is only evidence if it discriminates. This mutates one accepted
  # pin, asserts the gate FAILS, restores the exact bytes, and asserts it passes
  # again — the same shape as drift-negative-demonstration above.
  offchain-pin-negative-demonstration:
    name: accepted-pin gate fails closed on a mutated pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prove the accepted-pin gate closes
        run: |
          set -eu
          cp web/package.json /tmp/package.json.bak
          # A single version digit — the smallest possible disagreement with the
          # accepted census.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('web/package.json', 'utf8'));
            if (p.dependencies.next !== '15.1.12') {
              console.error('fixture drifted: expected next 15.1.12, saw ' + p.dependencies.next);
              process.exit(9);
            }
            p.dependencies.next = '15.1.11';
            fs.writeFileSync('web/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          if node tools/offchain/verify-accepted-pins.mjs; then
            echo "::error::the accepted-pin gate PASSED a mutated pin"
            cp /tmp/package.json.bak web/package.json
            exit 1
          fi
          echo "gate failed closed on the mutated pin, as required"
          cp /tmp/package.json.bak web/package.json
          node tools/offchain/verify-accepted-pins.mjs

      - name: Assert the working tree was restored exactly
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
