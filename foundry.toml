# VUX v1 — Foundry build configuration
#
# Two compilation units, deliberately separated (provenance refreeze §4/§6):
#
#   [profile.default]  Solidity =0.8.28 — VUX-original and Miner-derived source
#                      plus the VUX-original test harness. Consumes vendored
#                      OpenZeppelin and the (>=0.5.0) v3-core interfaces.
#
#   [profile.v3core]   Solidity =0.7.6 — the byte-identical vendored Uniswap
#                      v3-core tree, built with the exact settings that
#                      reproduce the accepted POOL_INIT_CODE_HASH. Upstream 0.7
#                      wrapping arithmetic is never ported to 0.8.x.
#
# Toolchain pins (refreeze §6 — 40-character immutable commits; branches, tags,
# and HEAD are never authority). Enforced by tools/provenance/verify-pins.sh.
#
#   solc 0.8.28   ethereum/solidity  7893614a31fbeacd1966994e310ed4f760772658
#   solc 0.7.6    ethereum/solidity  7338295feebfb3f044e265d5cf05ef1841b258b1
#   foundry v1.0.0 foundry-rs/foundry 8692e926198056d0228c1e166b1b6c34a5bed66c

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc = "0.8.28"
# Bytecode-affecting settings for the VUX unit remain deliberately unset, and
# Sprint 2 — the sprint that landed the first deployable VUX source — records
# that as a decision rather than an omission:
#
#   * No accepted authority freezes them, and unlike the =0.7.6 unit below there
#     is no constant to reproduce, so nothing here is load-bearing for evidence.
#   * The SDD's gas posture is "correctness-first … no optimization that changes
#     rounding or ordering semantics" (sdd.md:L274). Enabling the optimizer to
#     save gas on a monetary core, with no requirement asking for it, is exactly
#     the trade that posture declines.
#   * `evm_version` is a property of the deployment chain (an R-14
#     deployment-time fact), not of this sprint; pinning it here would freeze an
#     assumption about RH-chain opcode support that nobody has verified.
#
# These are revisited when deployment bytecode is frozen (Sprints 7–8), where
# the chain facts exist. They cannot affect POOL_INIT_CODE_HASH, which is
# produced by the separate =0.7.6 unit below.
#
# Read access to ./out is required by the structural-absence suites, which
# assert against the compiled ABI and runtime bytecode rather than the source
# text (test/token/VuxToken.t.sol, test/reserve/HardReserveSurface.t.sol).
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./out-v3core" },
]

[profile.ci]
# Inherits everything from [profile.default]; the only difference is fuzz depth.
# The SDD's testing strategy requires "forge fuzz (>=10,000 runs CI)"
# (sdd.md:L853) for the property suites carrying the redemption arithmetic.
# Kept out of the default profile deliberately: a 40x slower local test cycle
# pushes developers toward running the suite less often, which costs more
# correctness than the extra depth buys. CI selects it via FOUNDRY_PROFILE.
fuzz = { runs = 10_000 }

[profile.v3core]
# Vendored upstream tree only. Nothing VUX-owned compiles in this profile in
# Sprint 1; VuxPoolDeployer.sol (Sprint 4) is VUX-owned derivative source and
# lives outside the immutable upstream census even though it shares this unit.
src = "vendor/uniswap-v3-core-v1.0.0/contracts"
test = "vendor/uniswap-v3-core-v1.0.0/contracts"
script = "vendor/uniswap-v3-core-v1.0.0/contracts"
out = "out-v3core"
cache_path = "cache-v3core"
libs = []
solc = "0.7.6"
# The complete set of bytecode-affecting settings verified by the accepted
# refreeze §7 to reproduce
#   POOL_INIT_CODE_HASH = 0xe34f199b19b2b4f47f68442619d555527d244f78a3297ea89325f843f87b8b54
# Source: upstream hardhat.config.ts at the pin. Changing ANY of these
# invalidates the hash and requires a new operator-accepted refreeze
# (refreeze §7 obligation 3). tools/provenance/verify-init-code-hash.sh fails
# closed on mismatch.
optimizer = true
optimizer_runs = 800
evm_version = "istanbul"
bytecode_hash = "none"
