# VUX v1 — Foundry build configuration
#
# Two compilation units, deliberately separated (provenance refreeze §4/§6):
#
#   [profile.default]  Solidity =0.8.28 — VUX-original and Miner-derived source
#                      plus the VUX-original test harness. Consumes vendored
#                      OpenZeppelin and the (>=0.5.0) v3-core interfaces.
#
#   [profile.v3core]   Solidity =0.7.6 — the byte-identical vendored Uniswap
#                      v3-core tree, built with the exact settings that
#                      reproduce the accepted POOL_INIT_CODE_HASH. Upstream 0.7
#                      wrapping arithmetic is never ported to 0.8.x.
#
# Toolchain pins (refreeze §6 — 40-character immutable commits; branches, tags,
# and HEAD are never authority). Enforced by tools/provenance/verify-pins.sh.
#
#   solc 0.8.28   ethereum/solidity  7893614a31fbeacd1966994e310ed4f760772658
#   solc 0.7.6    ethereum/solidity  7338295feebfb3f044e265d5cf05ef1841b258b1
#   foundry v1.5.0 foundry-rs/foundry 1c57854462289b2e71ee7654cd6666217ed86ffd
#
# The Foundry line is the one selection that has moved since Sprint 1. It is
# governed by docs/authority/vux-v1-foundry-v1.5-toolchain-refreeze-2026-08.md,
# which supersedes the v1.0.0 selection in refreeze §6 and changes nothing else
# — neither solc pin, no build setting, no dependency, no vendored byte.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc = "0.8.28"
# SPRINT 4 — `src/v3core/` is VUX-owned source that belongs to the OTHER
# compilation unit (`=0.7.6`, [profile.v3core] below). It lives under `src/` so
# the provenance gates classify it as VUX-owned from the declared source roots
# (tools/provenance/census.sh) rather than needing a new root declared for one
# file; this line is what keeps this unit's `src = "src"` from trying to compile
# it under `=0.8.28` and failing on the pragma. The two units stay disjoint:
# nothing in `src/v3core/` is imported from `=0.8.28` source, and the treasury
# couples to the pool through the vendored `>=0.5.0` interfaces only.
skip = ["src/v3core/**"]
# Bytecode-affecting settings for the VUX unit were deliberately unset through
# Sprint 2, which recorded that as a decision rather than an omission:
#
#   * No accepted authority freezes them, and unlike the =0.7.6 unit below there
#     is no constant to reproduce, so nothing here is load-bearing for evidence.
#   * The SDD's gas posture is "correctness-first … no optimization that changes
#     rounding or ordering semantics" (sdd.md:L274). Enabling the optimizer to
#     save gas on a monetary core, with no requirement asking for it, is exactly
#     the trade that posture declines.
#   * `evm_version` is a property of the deployment chain (an R-14
#     deployment-time fact), not of this sprint; pinning it here would freeze an
#     assumption about RH-chain opcode support that nobody has verified.
#
# SPRINT 3 AMENDMENT — `via_ir` + `optimizer` enabled, as a compilation
# necessity rather than a gas choice. The accepted event schema fixes
# `Rig.Settled` at sixteen fields (sdd.md §3.2, thirteen of them non-indexed),
# and the legacy codegen pipeline cannot ABI-encode that many values within the
# EVM's 16-slot addressable stack window: it fails "Stack too deep" by exactly
# one slot even with the record threaded through a memory struct, emitted from
# its own frame, and with its last field read from storage (see the
# `_emitSettled` comment in src/Rig.sol, which documents each of those steps).
# The remaining options were to shrink the accepted event — reopening accepted
# architecture — or to hand-roll `log4` in assembly, which the sprint mandate
# excludes. `via_ir` is the Solidity team's own prescribed resolution for this
# error, is semantics-preserving by specification, and changes no rounding or
# ordering behaviour, so it does not engage the §274 posture above; the posture
# declined optimization *for gas with no requirement asking for it*, which this
# is not.
#
# Unchanged by this amendment: `evm_version` stays unset (still an R-14
# deployment fact), and POOL_INIT_CODE_HASH is untouched — it is produced by the
# separate =0.7.6 [profile.v3core] unit below, which sets its own complete,
# frozen settings and does not inherit these.
#
# These are revisited when deployment bytecode is frozen (Sprints 7–8), where
# the chain facts exist.
via_ir = true
optimizer = true
#
# Read access to ./out is required by the structural-absence suites, which
# assert against the compiled ABI and runtime bytecode rather than the source
# text (test/token/VuxToken.t.sol, test/reserve/HardReserveSurface.t.sol).
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./out-v3core" },
]

# Sprint 3 introduces the cycle-wide stateful invariant harness (sprint.md Task
# 3.5), so both profiles now pin invariant depth explicitly rather than inheriting
# Foundry's default. The local setting is deliberately shallow for the same reason
# fuzz depth is: a slow local cycle gets run less often.
[profile.default.invariant]
runs = 32
depth = 32
fail_on_revert = true

[profile.ci]
# Inherits everything from [profile.default]; the only differences are fuzz and
# invariant depth. The SDD's testing strategy requires "forge fuzz (>=10,000 runs
# CI)" (sdd.md:L853) for the property suites carrying the redemption arithmetic.
# Kept out of the default profile deliberately: a 40x slower local test cycle
# pushes developers toward running the suite less often, which costs more
# correctness than the extra depth buys. CI selects it via FOUNDRY_PROFILE.
fuzz = { runs = 10_000 }

[profile.ci.invariant]
# 256 x 64 = 16,384 handler calls per invariant, clearing the sprint's
# ">=10,000 depth-configured runs" bar (sprint.md Sprint 3 Success Metrics).
runs = 256
depth = 64
# The handler shapes every input so that no legitimate call reverts; a revert
# therefore means the harness is wrong or the contract is. Failing on it keeps
# the suite from silently degrading into "most sequences did nothing".
fail_on_revert = true

[profile.v3core]
# The vendored upstream tree plus the one VUX-owned file that must compile in
# the same =0.7.6 domain.
#
# SPRINT 4 AMENDMENT — `script` now points at `src/v3core`, which holds
# `VuxPoolDeployer.sol`. Foundry admits exactly one directory per compile role
# (src / test / script), and all three previously pointed at the vendored tree.
# `src` and `test` are left on that tree so the complete 32-file census still
# compiles and `out-v3core/UniswapV3Pool.sol/UniswapV3Pool.json` is still
# produced for the POOL_INIT_CODE_HASH gate; `script` was the free role, so it
# carries the VUX-owned half.
#
# The split is the point, not an accident of Foundry's layout: `src` here means
# "the immutable upstream census", and VuxPoolDeployer.sol is VUX-owned
# derivative source that must stay visibly outside it (sprint.md:L19) while
# still being compiled by the pinned 0.7.6 solc. It therefore lives under
# `src/v3core/` — inside the declared VUX source root that every provenance gate
# classifies from (tools/provenance/census.sh `VUX_SOURCE_ROOTS`) — and is
# reached from here, rather than being dropped into `vendor/`.
#
# Nothing bytecode-affecting changes: the settings below are unchanged, so the
# pool's creation bytecode and the accepted POOL_INIT_CODE_HASH are unaffected
# (verified by tools/provenance/verify-init-code-hash.sh, which fails closed).
src = "vendor/uniswap-v3-core-v1.0.0/contracts"
test = "vendor/uniswap-v3-core-v1.0.0/contracts"
script = "src/v3core"
# Explicitly emptied, and this line is load-bearing for the same reason
# `via_ir = false` below is. Profiles inherit from [profile.default], so the
# `skip = ["src/v3core/**"]` added there — which exists to keep the =0.8.28 unit
# off this unit's source — silently propagated here and made this profile skip
# the very file it is here to compile. The failure was quiet: the build stayed
# green and merely stopped emitting `out-v3core/VuxPoolDeployer.sol/`, which
# surfaced only when the Sprint-4 tests could not read the artifact. This is the
# residual inheritance hazard recorded in the Sprint-3 decision log, hit a second
# time; the structural fix (a guard comparing this profile's *effective* settings
# against the accepted refreeze set) remains outside this sprint's scope.
skip = []
out = "out-v3core"
cache_path = "cache-v3core"
libs = []
solc = "0.7.6"
# The complete set of bytecode-affecting settings verified by the accepted
# refreeze §7 to reproduce
#   POOL_INIT_CODE_HASH = 0xe34f199b19b2b4f47f68442619d555527d244f78a3297ea89325f843f87b8b54
# Source: upstream hardhat.config.ts at the pin. Changing ANY of these
# invalidates the hash and requires a new operator-accepted refreeze
# (refreeze §7 obligation 3). tools/provenance/verify-init-code-hash.sh fails
# closed on mismatch.
optimizer = true
optimizer_runs = 800
evm_version = "istanbul"
bytecode_hash = "none"
# Pinned OFF explicitly, and this line is load-bearing. Foundry profiles inherit
# from [profile.default], so the Sprint-3 `via_ir = true` added there silently
# propagated here and changed this unit's compilation pipeline — which changes
# the pool's creation bytecode and therefore POOL_INIT_CODE_HASH. Caught by
# tools/provenance/verify-init-code-hash.sh failing closed, exactly as refreeze
# §7 obligation 3 intends. This unit's settings are frozen as the complete set
# above; nothing may reach it by inheritance.
via_ir = false
